services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - DATABASE_URL=postgresql://vaesen:vaesenpass@db:5432/vaesen_db?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-vaesen-dev-secret-change-this}
    depends_on:
      - db
    command: sh -c "npm install --legacy-peer-deps && npx prisma generate && npm run dev"

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: vaesen
      POSTGRES_PASSWORD: vaesenpass
      POSTGRES_DB: vaesen_db
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
