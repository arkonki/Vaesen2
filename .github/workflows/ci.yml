name: Regression Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: vaesen_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d vaesen_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/vaesen_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/vaesen_test?schema=public
      CONTENT_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/vaesen_academic_test?schema=public
      CORE_CONTENT_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/vaesen_core_test?schema=public
      NEXTAUTH_SECRET: ci-only-secret-not-used-for-deployment-123456
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - name: Prepare Content Import Databases
        run: |
          node -e 'const {createPrismaClient}=require("./prisma/client"); const p=createPrismaClient(); (async()=>{for(const name of ["vaesen_academic_test","vaesen_core_test"])await p.$executeRawUnsafe("CREATE DATABASE "+name);})().finally(()=>p.$disconnect());'
          DATABASE_URL="$CONTENT_TEST_DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$CORE_CONTENT_TEST_DATABASE_URL" npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Legacy Castle Migration
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:test-only-password@localhost:5432/vaesen_legacy_test?schema=public
        run: |
          node -e 'const {createPrismaClient}=require("./prisma/client"); const p=createPrismaClient(); p.$executeRawUnsafe("CREATE DATABASE vaesen_legacy_test").finally(()=>p.$disconnect());'
          npm run test:migration
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build:portable
      - name: HTTP Smoke Checks
        env:
          SMOKE_BASE_URL: http://localhost:3000
        run: |
          RUNTIME=$(mktemp -d)
          tar -xzf build/vaesen-portable.tar.gz -C "$RUNTIME"
          PORT=3000 APP_HOST=127.0.0.1 node "$RUNTIME/vaesen-portable/check.mjs"
          PORT=3000 APP_HOST=127.0.0.1 node "$RUNTIME/vaesen-portable/start.mjs" > /tmp/vaesen-server.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/auth/csrf > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run test:http
